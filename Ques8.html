<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Cards</title>
    <style>
        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav {
            background-color: #555;
            padding: 15px;
            position: sticky;
            top: 0;
        }
        .card {
            background-color: lightblue;
            padding: 25px;
            width: 220px;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Website</h1>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
    </nav>
    <main>
        <h2>Welcome to My Website</h2>
        <div class="card">
            <h3>HTML</h3>
            <p>HTML is used to create webpages.</p>
        </div>
        <div class="card">
            <h3>CSS</h3>
            <p>CSS is used to style webpages.</p>
        </div>
    </main>
</body>
</html>
